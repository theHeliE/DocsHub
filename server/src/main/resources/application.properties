spring.application.name=server

# Application log level. INFO reports document lifecycle events (created, joined, left)
# and anything rejected; DEBUG additionally traces every applied operation, and TRACE
# adds cursor movement. Document content and access codes are never logged at any level.
logging.level.com.server=INFO

# Uncomment to write the same output to a file alongside the console.
#logging.file.name=logs/server.log
